version: "3.9"

services: 
    db:
      image: postgres:15
      container_name: student_db
      restart: always

      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgresdatabase2026
        POSTGRES_DB: student_management_database

      ports:
        - "5432:5432"
        
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 5s
        retries: 5


    app:
      build: .
      container_name: student_app
      restart: always

      depends_on:
        db:
          condition: service_healthy

      environment:
        DATABASE_URL: postgresql://postgres:postgresdatabase2026@db:5432/student_management_database

      ports:
        - "8000:8000"

