version: "3.9"

services: 
    db:
      image: postgres:15
      container_name: student_db
      restart: always

      env_file:
        - .env

      ports:
        - "5432:5432"
        
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 5s
        retries: 5


    app:
      build: .
      container_name: student_app
      restart: always

      depends_on:
        db:
          condition: service_healthy

      env_file:
          - .env

      ports:
        - "8000:8000"
